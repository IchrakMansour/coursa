<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coursaBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3389fc"/>
      <stop offset="1" stop-color="#1553de"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#coursaBg)"/>
  <!-- « C » de Coursa : arc épais ouvert à droite -->
  <circle cx="256" cy="256" r="132" fill="none" stroke="#ffffff" stroke-width="52"
          stroke-linecap="round" stroke-dasharray="622 208"
          transform="rotate(45 256 256)"/>
  <!-- Lignes de vitesse : l'idée de livraison rapide -->
  <rect x="368" y="214" width="120" height="26" rx="13" fill="#ffffff"/>
  <rect x="368" y="272" width="84" height="26" rx="13" fill="#ffffff" opacity="0.9"/>
